<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <h3>🏷️ Fast Label Printer</h3>
    <button id="options-btn" class="icon-btn" title="Einstellungen">⚙️</button>
  </header>

  <main id="main" hidden>
    <div class="row">
      <label for="job-select">Labeldruck</label>
      <select id="job-select"></select>
    </div>

    <div id="preview" class="preview">
      <img id="preview-img" alt="Label-Vorschau" hidden>
      <span id="preview-msg" class="preview-msg">Vorschau wird geladen …</span>
    </div>
    <div id="format-info" class="format-info"></div>
    <div id="fields" class="fields"></div>
    <button id="clear-fields-btn" class="clear-btn" hidden>🗑️ Eingaben löschen</button>

    <div class="row two">
      <div>
        <label for="printer-select">Drucker</label>
        <select id="printer-select"></select>
      </div>
      <div class="copies">
        <label for="copies">Anzahl</label>
        <input id="copies" type="number" min="1" max="999" value="1">
      </div>
    </div>

    <ul id="warnings" class="warnings"></ul>

    <button id="print-btn" class="print-btn">🖨️ Drucken</button>

    <details class="zpl-details">
      <summary>ZPL anzeigen</summary>
      <pre id="zpl-output"></pre>
    </details>
  </main>

  <div id="empty" class="message" hidden>
    <p><strong>Kein Labeldruck verfügbar.</strong></p>
    <p>Für diese Seite ist kein Labeldruck hinterlegt und es gibt keinen manuellen Labeldruck.</p>
    <button id="empty-settings-btn" class="btn">⚙️ Einstellungen öffnen</button>
  </div>

  <div id="status" class="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
