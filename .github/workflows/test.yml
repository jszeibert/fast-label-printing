name: Test Extension

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-extension:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install web-ext
      run: npm install -g web-ext
        
    - name: Test Firefox Build
      run: |
        echo "🦊 Testing if Firefox extension builds..."
        web-ext build --source-dir=src --artifacts-dir=test-artifacts --overwrite-dest
        
        if [ -f test-artifacts/*.zip ]; then
          echo "✅ Firefox XPI builds successfully"
        else
          echo "❌ Firefox build failed"
          exit 1
        fi
        
    - name: Test Chrome Compatibility
      run: |
        echo "🌐 Testing Chrome compatibility..."
        
        # Create Chrome version (remove Firefox-specific fields)
        mkdir -p chrome-test
        cp -r src/* chrome-test/
        
        node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('chrome-test/manifest.json'));
          delete manifest.browser_specific_settings;
          fs.writeFileSync('chrome-test/manifest.json', JSON.stringify(manifest, null, 2));
        "
        
        # Test if Chrome ZIP can be created
        cd chrome-test && zip -r ../chrome-test.zip . && cd ..
        
        if [ -f chrome-test.zip ]; then
          echo "✅ Chrome extension packages successfully"
        else
          echo "❌ Chrome packaging failed"
          exit 1
        fi
        
    - name: Test Required Files Exist
      run: |
        echo "📁 Checking required files exist..."
        
        required_files=(
          "src/manifest.json"
          "src/popup/popup.html"
          "src/popup/popup.js"
          "src/options/options.html"
          "src/options/options.js"
        )
        
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ Missing required file: $file"
            exit 1
          fi
        done
        
        echo "✅ All required files present"
        
    - name: Test JavaScript Syntax
      run: |
        echo "🔍 Checking JavaScript syntax..."
        for file in $(find src -name '*.js'); do
          echo "Checking $file..."
          node --check "$file" || exit 1
        done
        echo "✅ JavaScript syntax is valid"

    - name: Unit Tests
      run: node --test

    - name: Lint Extension
      run: web-ext lint --self-hosted --source-dir=src
